<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario con Validaciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Formulario de Registro</h2>

<form id="miFormulario" action="#" method="POST">

  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" name="nombre" required>
  <span id="errorNombre"></span>

  <label for="correo">Correo electrónico:</label>
  <input type="email" id="correo" name="correo" required>
  <span id="errorCorreo"></span>

  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" required>
  <span id="errorPassword"></span>

  <label for="confirmar">Confirmar contraseña:</label>
  <input type="password" id="confirmar" name="confirmar" required>
  <span id="errorConfirmar"></span>

  <label for="edad">Edad:</label>
  <input type="number" id="edad" name="edad" required>
  <span id="errorEdad"></span>

  <button type="submit" id="btnEnviar" disabled>Enviar</button>
  <button type="reset">Reiniciar</button>

</form>

<script src="script.js"></script>
</body>
</html>
