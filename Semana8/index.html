<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página Web con Bootstrap y JavaScript</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== ENCABEZADO ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Tienda</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
        </ul>
    </div>
</nav>

<!-- ===== SECCIÓN PRINCIPAL ===== -->
<div class="container mt-4">

    <!-- Carrusel de imágenes -->
    <div id="carrusel" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://via.placeholder.com/800x300" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="https://via.placeholder.com/800x300/999" class="d-block w-100">
            </div>
        </div>
    </div>

    <!-- Tabla de productos -->
    <h4>Lista de Productos</h4>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Producto</th>
                <th>Precio ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Gorra</td><td>$5</td></tr>
            <tr><td>Camiseta</td><td>$5</td></tr>
            <tr><td>Calentador hombre</td><td>$32</td></tr>
            <tr><td>Calentador mujer</td><td>$27</td></tr>
            <tr><td>Calentador niña</td><td>$22</td></tr>
            <tr><td>Calentador niño</td><td>$23</td></tr>
        </tbody>
    </table>

    <!-- Botón de alerta -->
    <button class="btn btn-warning mb-4" onclick="mostrarAlerta()">
        Mostrar alerta
    </button>

    <!-- Formulario de contacto -->
    <h4>Formulario de Contacto</h4>
    <form onsubmit="validarFormulario(event)">
        <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre">
        <input type="email" id="correo" class="form-control mb-2" placeholder="Correo electrónico">
        <textarea id="mensaje" class="form-control mb-2" placeholder="Mensaje"></textarea>
        <button class="btn btn-primary">Enviar</button>
    </form>

    <p id="error" class="text-danger mt-2"></p>

</div>

<!-- ===== PIE DE PÁGINA ===== -->
<footer class="bg-dark text-white text-center mt-4 p-3">
    <p>Contacto: info@mitienda.com</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript propio -->
<script src="script.js"></script>

</body>
</html>
